services:
  ledger:
    build: .
    container_name: nasjizhang
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:3001"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SECRET: ${APP_SECRET:?请在 .env 中设置 APP_SECRET}
      DB_PATH: /app/data/ledger.sqlite
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./data:/app/data